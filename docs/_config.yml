# The Drayker documentation theme — one layout shared by every *.drayker.org site.
# Source: https://github.com/draykerdk/drayker-theme
remote_theme: draykerdk/drayker-theme

plugins:
  - jekyll-remote-theme
  - jekyll-optional-front-matter

title: OSDK
description: The universal coupler proposed to connect devices to the Drayker network.

dk_kicker: Device layer
dk_subdomain: osdk.drayker.org
dk_repo: https://github.com/draykerdk/osdk

defaults:
  - scope:
      path: ""
    values:
      layout: default
