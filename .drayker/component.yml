schema_version: 1
component:
  id: osdk
  name: OSDK
  layer: DEVICES
  artifact_type: architecture
  problem: Define a universal coupling layer through which devices could connect to the Drayker network and run personal intelligence.
  scope:
    - Public design intent for device-to-network coupling.
    - Public description of a future runtime on top of conventional operating systems, functioning as an integrated application or super-app environment.
    - Public description of edge hardware coupling preserving local privacy and zero telemetry.
    - Questions and boundaries needed for a future specification.
  non_scope:
    - A released device adapter or proprietary lock-in operating system today.
    - Guaranteed compatibility with all existing hardware without testing.
  dependencies:
    - dk-network
    - personal
    - uid
  implementation:
    level: none
    scope: OSDK is currently an architectural design without a published standalone OS implementation.
    evidence:
      - type: document
        ref: docs/README.md
  risks:
    - The universal-coupler description may overstate an early concept.
    - Hardware and security constraints remain unspecified.
  contributions:
    availability: open
    entrypoint: https://github.com/draykerdk/osdk/issues
  source_of_truth:
    repository: https://github.com/draykerdk/osdk
    path: docs/README.md
  last_reviewed: "2026-09-03"
